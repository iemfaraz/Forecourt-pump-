  window.addEventListener('online',showConnection);window.addEventListener('offline',showConnection);
  showConnection();
  navigator.serviceWorker.register('./station-sw.js',{updateViaCache:'none'}).then(reg=>{
    const worker=reg.installing;
    if(worker)worker.addEventListener('statechange',()=>{
      if(worker.state==='redundant'&&!navigator.serviceWorker.controller)badge.textContent='Reconnect to prepare offline access';
    });
    showConnection();
  }).catch(()=>{if(!navigator.serviceWorker.controller)badge.textContent='Offline access unavailable'});
}
</script></html>
