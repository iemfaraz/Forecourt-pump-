name: Check single-computer station
on:
  push:
    paths: ['station-sw.js', 'device-store.js', 'staff.js', 'app.js', 'index.html', 'tests/device-smoke.py', '.github/workflows/device-check.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install selenium
      - run: python tests/device-smoke.py
